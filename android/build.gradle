apply plugin: "com.android.library"
apply plugin: "expo-module-gradle-plugin"

android {
    namespace "expo.modules.wifimanager"
    compileSdk 36

    defaultConfig {
        minSdk 24
        versionCode 1
        versionName "1.0.0"
    }
}
